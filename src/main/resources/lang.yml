# =====================================================================
#                        XingXingShop  语言文件
#
#  支持 & 颜色码；{0} {1} 为顺序占位符
# =====================================================================

prefix: '&8[&a商店&8] &r'

# ---------------- 界面标题 ----------------
gui:
  title-menu: '&8商店'
  title-buy: '&8购买 &7» &a{shop}'
  title-sell: '&8收购 &7» &a{shop}'
  title-quantity: '&8选择数量'
  title-chat: '&8输入数量'
  title-confirm: '&8请确认交易'

# ---------------- 通用 ----------------
no-permission: '&c你没有权限这么做'
player-only: '&c这个命令只能由玩家执行'
no-shops: '&c还没有任何商店，请检查 plugins/XingXingShop/shops/'
shop-closed: '&c这个活动商店还没开放或已经结束'
shop-not-found: '&c找不到商店 &f{0}'
hand-empty: '&c请手持一个物品再执行'
no-currency: '&c该商品使用的货币当前不可用'
failed: '&c操作失败，请稍后再试'
reloaded: '&a配置和商店已重新加载'

# ---------------- 购买 ----------------
buy:
  success: '&a已购买 &f{0} &7花费 &e{1}'
  not-enough-money: '&c余额不足，需要 &e{0} &c才能买 &f{1}'
  out-of-stock: '&c&f{0} &c已经卖光了'
  limit-reached: '&c你今天已经买满 &f{0} &c份了，明天再来吧'

# ---------------- 收购 ----------------
sell:
  success: '&a已出售 &f{0} &7获得 &e{1}'
  not-enough-items: '&c你背包里的 &f{0} &c不够'
  limit-reached: '&c你今天已经卖满 &f{0} &c份了，明天再来吧'

# ---------------- 管理命令 ----------------
admin:
  added: '&a已上架 &f{0} &a到分类 &f{1}&a，价格 &e{2}'
  removed: '&a已从 &f{1} &a移除商品 &f{0}'
  priced: '&a已把商品 &f{0} &a的价格改为 &e{1}'
  stocked: '&a已把商品 &f{0} &a的库存改为 &f{1}'
# ---------------- 聊天框输入数量 ----------------
chat-input:
  prompt: '&e请在聊天框输入要 {1} 的 &f{0} &e数量 &7(输入 cancel 取消)'
  invalid: '&c输入无效，请输入一个正整数'
  cancelled: '&7已取消输入'
  timeout: '&7输入超时，已取消'
# ---------------- 交易日志 ----------------
log:
  header: '&8&m---------&r &6{0} &7的交易记录 &8&m---------'
  header-all: '&8&m---------&r &6全部交易记录 &8&m---------'
  line: '&7{0} &f{1} &7{2} &f{3} &7× &f{4} &8| &e{5}'
  empty: '&7没有找到交易记录'
  page: '&7第 &f{0} &7/ &f{1} &7页 &8| &7共 &f{2} &7条'
  usage: '&c用法：/shop log [玩家名] [页码]'
  folder: '&7日志文件位置：&f{0}'
  alert: '&c[商店] &f{player} &c可能有刷钱行为：&f{reason} &8| &7{detail}'