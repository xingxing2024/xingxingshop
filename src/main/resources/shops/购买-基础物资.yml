# @shop-template-version: 3
# =====================================================================
#           基础物资     （购买菜单）
#
#  食物、燃料、矿物等日常消耗品
#
#  ───────────────────────────────────────────────────────────────
#   定价说明
#   购买价 = 回收价 × 4~8 倍，保证玩家不能「买了再卖」刷钱
#   农作物这类易得的物品定得很便宜，让新手也买得起
#  ───────────────────────────────────────────────────────────────
#
#  写法（越短越好）：
#    bread: 0.375                 商品 key = 材质名，后面直接写单价
#    cooked_beef: 0.975           不用再写 material / slot
#    需要限量、限购时才展开：
#    golden_apple:
#      buy: 78
#      stock: 200
#      limit: 3
#    所有价格都是「单个」的价格，界面里买 1 组 = 单价 × 64
# =====================================================================

