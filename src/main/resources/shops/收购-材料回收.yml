# @shop-template-version: 3
# =====================================================================
#           材料回收     （收购菜单）
#
#  玩家把东西卖给商店换钱。
#
#  ───────────────────────────────────────────────────────────────
#   定价基准（单个物品的收购价）
#
#   烂大街的        0.01 ~ 0.05   泥土、圆石、腐肉、种子
#   农作物          0.05 ~ 0.10   胡萝卜、土豆、小麦
#   常见材料        0.10 ~ 0.40   木头、煤炭、沙子、线
#   矿物            0.40 ~ 1.50   铁锭、铜锭、金锭
#   稀有矿物        2.00 ~ 6.00   青金石、红石、紫水晶
#   珍贵            25 ~ 60       钻石、绿宝石、下界合金
#
#   ⚠ 这里是「单个」的价格。卖一组 64 个就是 ×64
#     例：胡萝卜 0.05/个 → 卖一组能拿 3.2 元
#  ───────────────────────────────────────────────────────────────
#
#  写法（越短越好）：
#    type: SELL          必须有，表示这是收购菜单
#    cobblestone: 0.02   商品 key = 材质名，后面直接写收购价
#    diamond:            需要单独限卖时才展开
#      sell: 25
#      sell-limit: 8
#    ⚠ 价格是「单个」的价格，卖一组 64 个就是 ×64
# =====================================================================

id: recycle

name: '材料回收'

icon: HOPPER

type: SELL

desc:
  - '&7把你多余的材料卖给商店'
  - '&7价格按稀有度分档'

items:
  # ================= 烂大街（0.01 ~ 0.05）=================
  dirt: 0.01
  cobblestone: 0.02
  gravel: 0.02
  sand: 0.02
  netherrack: 0.02
  stone: 0.04
  clay_ball: 0.05
  # ================= 农作物（0.05 ~ 0.10）=================
  oak_log: 0.10
  oak_planks: 0.08
  glass: 0.12
  white_wool: 0.12
  apple: 0.12
  glowstone_dust: 0.60
  # ================= 稀有矿物（2.00 ~ 6.00）=================
