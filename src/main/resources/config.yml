# =====================================================================
#                        XingXingShop  主配置
#
#   改完执行 /shop reload 立刻生效，不用重启服务器
# =====================================================================

# ---------------------------------------------------------------------
#  货币设置
#
#  可选值：
#    vault    用 Vault 经济（需要装 Vault + EssentialsX/CMI/XConomy 之类）
#    points   用 PlayerPoints 点券（需要装 PlayerPoints）
#    你自己在下面自定义的 id
# ---------------------------------------------------------------------
external-trades:
  trmenu:
    # 按 TrMenu 点击按钮名称记录随后 5 秒内的 Vault 余额变化；设置 false 关闭
    enabled: true

currency: vault

# ---------------------------------------------------------------------
#  出售价格倍率
#
#  玩家把东西卖给商店能拿多少钱 = 该商品买入价 × 这个数字
#  1.0 = 原价收，0.5 = 半价收，0 = 完全不允许出售
#
#  例：圆石买价 32，这里填 0.4 —— 玩家卖 1 份能拿到 12.8
# ---------------------------------------------------------------------
sell-ratio: 0.4

# ---------------------------------------------------------------------
#  每日限购 / 限卖总开关
#
#  购买：商品里写 limit: 3 就生效，没写的商品不限购
#  收购：商品里写 sell-limit: 64 就生效，默认每种每天 64 份
#       想放开某种就写 sell-limit: 0
# ---------------------------------------------------------------------
limits: true

# 收购侧的限卖总开关（收购菜单用，跟上面的 limits 独立）
#
# 默认按「卖出单价」自动分档：
#   单价 < 0.5   →  每天 512 个   （泥土、农作物，随便卖）
#   单价 < 2     →  每天 256 个   （煤炭、铁锭）
#   单价 < 10    →  每天  64 个   （金锭、烈焰棒）
#   单价 < 100   →  每天  16 个   （钻石、绿宝石）
#   单价 >= 100  →  每天   4 个   （下界合金、下界之星）
#
# 想给某个商品单独设定，就在它的 yml 里写 sell-limit: 100
# 写 sell-limit: 0 表示这件商品完全不限卖
sell-limits: true

# 防止刷钱：收购价高于购买价时自动压到购买价
#
# 例：某商品买价 10，收购商店却写了 12，玩家就能无限低买高卖。
# 开启后插件加载时会自动把收购价压到 10，并在控制台提示。
# 确定是自己的经济设计、想允许这种情况就改成 false。
anti-arbitrage: true

# bStats 匿名统计（不收集玩家名 / 数据内容）
# 统计页面：https://bstats.org/plugin/bukkit/xingxingshop/35029
# 不想上报就改成 false
metrics:
  enabled: true

# 启动时检查 GitHub 新版本（只打日志，不自动下载）
update-check: true

# ---------------------------------------------------------------------
#  交易记录
#
#  记录每一笔买卖，方便排查刷钱
#
#  存储方式（database.type）：
#    sqlite   零配置，数据存在 plugins/XingXingShop/transactions.db（默认，单服）
#    mysql    跨服共享，需要填下面的连接信息
#    none     不存数据库，只用文本日志
#
#  MySQL 跨服说明：
#    所有服连同一个数据库，库存 / 限购用数据库事务原子扣减，
#    多服同时买也不会超卖；各服每 5 秒自动刷新一次库存显示。
#    交易、库存、限购、个人日报投递记录全部存在这个库里。
#
#  文本日志始终会写：
#    plugins/XingXingShop/logs/transactions-日期.log
#
#  游戏内查询：/shop log [玩家名] [页码]
# ---------------------------------------------------------------------
database:
  # sqlite = 单服，不用改（默认）
  # mysql  = 跨服，填下面的地址、库名、账号密码
  # none   = 不存数据库
  type: sqlite

  # 多个插件共用一个库时，可以给表加前缀，避免 shop_* 冲突
  table-prefix: ''

  # 跨服商店配置同步：一服 /shop reload 后，其他服自动拉取 shops/*.yml
  # 只在 MySQL 模式生效；单服 / 需要各服不同配置时改成 false
  shop-sync: true

  # JDBC 驱动不打包进插件，首次启动自动下载到 plugins/XingXingShop/lib/
  # 阿里云 Maven 镜像，下载失败时插件会退回文本日志 / stock.yml
  driver-download: true
  driver-repo: 'https://maven.aliyun.com/repository/public'

  # MySQL 连接信息（只有 type 改成 mysql 才需要管）
  # 多个服务器填同一份，就能跨服共享库存 / 限购 / 交易记录
  mysql:
    host: localhost        # 数据库地址，跟服务器同一台就写 localhost
    port: 3306             # 数据库端口，一般不用改
    database: minecraft    # 数据库名（先在 MySQL 里建好这个库）
    username: root         # 数据库账号
    password: ''           # 数据库密码

    # 连接池（大服可以调大，一般 4 够用）
    pool-size: 4
    connection-timeout: 5000

    # 一般不用管下面这项。
    # 只有用云数据库 / 特殊参数时才需要自己加一行完整连接串：
    # url: 'jdbc:mysql://你的地址:3306/库名?useSSL=false'

log:
  # 是否记录交易
  enabled: true

  # 是否在检测到可疑交易时提醒在线管理员
  alert:
    enabled: true
    # 10 秒内交易超过多少笔算「高频刷单」（0 = 关闭这项检测）
    rate-limit: 20
    # 单笔金额超过多少算「大额交易」（0 = 关闭这项检测）
    amount: 10000

  # 每日报表
  report:
    enabled: true
    # 每天几点发（24 小时制，服务器本地时间）
    hour: 0
    # 统计「昨天」还是「今天到现在」
    #   yesterday = 每天早上汇总前一天（推荐）
    #   today     = 汇总当天到现在
    range: yesterday
    # 是否发给在线管理员
    notify-in-game: true
    # 是否写一份到 reports/日期.log
    write-file: true

    # ---- 个人日报（给玩家看自己的交易汇总）----
    player:
      # 总开关：是否生成/允许查看个人日报
      enabled: true
      # 每天定时推送给在线玩家（关掉后玩家仍可用 /shop myreport 自己看）
      notify-in-game: true

# ---------------------------------------------------------------------
#  动态价格总开关
#
#  商品里写了 dynamic: true 的才会启用。
#  规则：库存越少、价格越贵；库存被买空时涨到上限倍率。
#  玩家卖回来会补充库存，价格随之回落。
# ---------------------------------------------------------------------
dynamic-pricing: true

dynamic:
  # 涨跌幅度：0.5 表示库存见底时价格最多涨 50%
  coefficient: 0.5
  # 最低 / 最高倍率，防止价格失控
  min: 0.3
  max: 3.0
  # 价格公式：linear（线性）/ step（阶梯）/ exponential（指数）
  formula: linear
  # step 公式的阶梯数
  steps: 5

# ---------------------------------------------------------------------
#  动态收购（推荐开启）
#
#  玩家把同一种东西卖得越多，收购价就越低，防止有人挂机刷钱。
#  公式：收购价 = 基础价 × (1 - 跌幅)
#        跌幅最大不超过 max-drop
#
#  例（默认值）：
#    卖够 2000 个 → 收购价降到 40%
#    之后不会再跌
#
#  想关掉就把 enabled 改成 false
# ---------------------------------------------------------------------
sell-dynamic:
  enabled: true
  # 卖够多少个之后价格触底
  limit: 2000
  # 最大跌幅（0.6 = 最多跌 60%，也就是只剩 40%）
  max-drop: 0.6

# ---------------------------------------------------------------------
#  界面设置
# ---------------------------------------------------------------------
gui:
  # 行数 1~6，最后一行固定是控制条（翻页 / 切换 / 关闭）
  rows: 6
  # 购买界面的标题
  buy-title: '&8购买 &7» &a{shop}'
  # 收购界面的标题
  sell-title: '&8收购 &7» &a{shop}'

# ---------------------------------------------------------------------
#  音效
#
#  enabled: 总开关
#  volume / pitch: 音量与音调
#
#  值填原版音效 key（小写），也可以填资源包自定义音效。
#  留空字符串 '' 表示这个动作不播声音。
#
#  常用音效参考：
#    entity.experience_orb.pickup   叮（升级/拾取）
#    entity.item.pickup             物品拾取
#    entity.player.levelup          升级
#    block.note_block.bass          低音（失败）
#    block.note_block.pling         高音
#    entity.villager.no             村民拒绝（错误）
#    ui.button.click                按钮点击
#    block.chest.open               开箱
# ---------------------------------------------------------------------
sound:
  enabled: true
  volume: 1.0
  pitch: 1.0

  # 界面交互
  click: ui.button.click          # 点击商品
  cancel: ui.button.click         # 取消交易
  open: block.chest.open          # 打开商店

  # 交易结果
  buy-success: entity.experience_orb.pickup   # 购买成功
  sell-success: entity.item.pickup            # 出售成功

  # 失败提示
  not-enough-money: block.note_block.bass     # 余额不足
  not-enough-items: block.note_block.bass     # 背包没有可卖的东西
  out-of-stock: block.note_block.bass         # 库存不足
  limit-reached: block.note_block.bass        # 达到每日限购/限卖
  error: entity.villager.no                   # 其它错误

# ---------------------------------------------------------------------
#  自定义货币（可选）
#
#  ⚠ PlaceholderAPI 的变量是「只读」的，只能读余额、不能扣钱。
#    所以这里的货币只能用于「展示余额」，不能拿来做购买货币。
#    想用点券买东西请装 PlayerPoints，然后把上面的 currency 改成 points。
# ---------------------------------------------------------------------
custom-currency: {}
# 示例：
# custom-currency:
#   vip点:
#     display-name: 'VIP点'
#     placeholder: '%vip_points%'
# 自动识别固定价格的 TrMenu 捕捉箱购买，余额与到账双重校验。
external-trades:
  trmenu-nekotraps:
    enabled: true
